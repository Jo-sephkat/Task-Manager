<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TaskManager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #F1F4FA;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 sm:p-10 max-w-md w-full shadow-2xl border border-slate-100">
        <!-- Logo -->
        <div class="flex flex-col items-center text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 mb-3">
                <i data-lucide="check-square" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Welcome Back</h1>
            <p class="text-xs text-slate-400 font-medium mt-1">Sign in to your TaskManager workspace</p>
        </div>

        {% if form.errors %}
            <div class="bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl p-3 mb-5">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
                {{ form.username }}
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                {{ form.password }}
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs py-3 rounded-xl shadow-md shadow-blue-500/20 transition active:scale-95">
                    Sign In to Workspace
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-100 pt-5">
            Don't have an account? 
            <a href="{% url 'tasks:register' %}" class="font-bold text-blue-600 hover:text-blue-800 transition">
                Create Account
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
