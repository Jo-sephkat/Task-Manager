<!-- Modal for creating new task with description and subtasks -->
<div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-3xl p-6 sm:p-7 max-w-lg w-full mx-4 shadow-2xl border border-slate-100 transform transition-all">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <h3 class="text-base font-bold text-slate-800">Create New Task</h3>
            <button onclick="document.getElementById('task-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form action="{% url 'tasks:create_task' %}" method="POST" class="mt-4 space-y-3.5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Task Title</label>
                <input type="text" name="title" required placeholder="e.g. Implement OAuth & JWT authentication" 
                       class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Description (Optional)</label>
                <textarea name="description" rows="2" placeholder="Brief summary of the deliverable..." 
                          class="w-full text-xs px-3.5 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Initial Subtasks (One per line)</label>
                <textarea name="subtasks" rows="3" placeholder="Database migration for token blacklist&#10;Write middleware authentication guard&#10;Add unit tests for expired tokens" 
                          class="w-full text-xs px-3.5 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-slate-400 font-mono"></textarea>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Track</label>
                    <select name="track_code" class="w-full text-xs px-2.5 py-2 rounded-xl border border-slate-200">
                        <option value="A">Track A (Blue)</option>
                        <option value="B" selected>Track B (Purple)</option>
                        <option value="C">Track C (Pink)</option>
                        <option value="D">Track D (Amber)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
                    <select name="status" class="w-full text-xs px-2.5 py-2 rounded-xl border border-slate-200">
                        <option value="draft">Draft</option>
                        <option value="in_progress" selected>In Progress</option>
                        <option value="editing">Editing</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Priority</label>
                    <select name="priority" class="w-full text-xs px-2.5 py-2 rounded-xl border border-slate-200">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>

            <div class="pt-2 flex justify-end gap-2 border-t border-slate-50">
                <button type="button" onclick="document.getElementById('task-modal').classList.add('hidden')" 
                        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-5 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md shadow-blue-500/20 transition">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>
