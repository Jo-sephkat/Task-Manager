<!-- Left Navigation Sidebar (Smoothly Collapsible) -->
<aside id="main-sidebar" 
       class="w-56 bg-white border-r border-slate-200/80 flex flex-col justify-between py-5 px-3 transition-all duration-300 select-none shadow-sm z-20 shrink-0">
    <div class="space-y-6">
        <!-- Logo / App Title -->
        <a href="{% url 'tasks:dashboard' %}" class="flex items-center gap-2.5 px-2.5 overflow-hidden">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
                <i data-lucide="check-square" class="w-4 h-4"></i>
            </div>
            <div class="sidebar-text truncate transition-opacity duration-200">
                <h1 class="font-bold text-slate-800 text-sm leading-tight">TaskManager</h1>
                <p class="text-[10px] text-slate-400 font-medium">Enterprise</p>
            </div>
        </a>

        <!-- Navigation Links -->
        <nav class="space-y-1">
            <a href="{% url 'tasks:dashboard' %}" 
               title="Dashboard"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all {% if active_menu == 'dashboard' %}bg-blue-50 text-blue-600 shadow-sm{% else %}text-slate-500 hover:text-slate-800 hover:bg-slate-50{% endif %}">
                <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
                <span class="sidebar-text truncate">Dashboard</span>
            </a>

            <a href="{% url 'tasks:task_list' %}" 
               title="Tasks"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all {% if active_menu == 'tasks' %}bg-blue-50 text-blue-600 shadow-sm{% else %}text-slate-500 hover:text-slate-800 hover:bg-slate-50{% endif %}">
                <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i>
                <span class="sidebar-text truncate">Tasks</span>
            </a>

            <a href="{% url 'tasks:planning' %}" 
               title="Planning"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all {% if active_menu == 'planning' %}bg-blue-50 text-blue-600 shadow-sm{% else %}text-slate-500 hover:text-slate-800 hover:bg-slate-50{% endif %}">
                <i data-lucide="calendar-range" class="w-4 h-4 shrink-0"></i>
                <span class="sidebar-text truncate">Planning</span>
            </a>

            <a href="{% url 'tasks:analytics' %}" 
               title="Analytics"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all {% if active_menu == 'analytics' %}bg-blue-50 text-blue-600 shadow-sm{% else %}text-slate-500 hover:text-slate-800 hover:bg-slate-50{% endif %}">
                <i data-lucide="bar-chart-3" class="w-4 h-4 shrink-0"></i>
                <span class="sidebar-text truncate">Analytics</span>
            </a>

            <a href="{% url 'tasks:messages' %}" 
               title="Messages"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all {% if active_menu == 'messages' %}bg-blue-50 text-blue-600 shadow-sm{% else %}text-slate-500 hover:text-slate-800 hover:bg-slate-50{% endif %}">
                <i data-lucide="message-square" class="w-4 h-4 shrink-0"></i>
                <span class="sidebar-text truncate">Messages</span>
            </a>
        </nav>
    </div>

    <!-- User Snippet at Bottom -->
    <div class="px-2 pt-3 border-t border-slate-100 flex items-center gap-2.5 overflow-hidden">
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center shrink-0">
            {{ request.user.first_name|default:request.user.username|slice:":1"|upper }}{{ request.user.last_name|slice:":1"|upper }}
        </div>
        <div class="sidebar-text truncate">
            <div class="text-xs font-bold text-slate-800 truncate">{{ request.user.get_full_name|default:request.user.username }}</div>
            <div class="text-[10px] text-slate-400 truncate">@{{ request.user.username }}</div>
        </div>
    </div>
</aside>
