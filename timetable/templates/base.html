<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTime - Class Timetable Manager</title>

    <!-- main styles -->
    <link rel="stylesheet" href="{% static 'timetable/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'timetable/css/colors.css' %}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <h1><a href="{% url 'timetable:dashboard' %}">UniTime</a></h1>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <span>Hello, {{ user.username }}</span>
                    <a href="{% url 'timetable:logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'timetable:login' %}">Login</a>
                    <a href="{% url 'timetable:register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2025 UniTime - Class Timetable Manager</p>
    </footer>

    <!-- common scripts -->
    <script src="{% static 'timetable/js/script.js' %}"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- page-specific scripts -->
    {% block extra_scripts %}{% endblock %}
</body>
</html>
